server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback: cualquier ruta que no sea un archivo estático vuelve a index.html
    # Esto es CRÍTICO para React Router con history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso al backend. Se preserva el path completo (proxy_pass sin barra final)
    # porque el backend expone /auth/... (login/register) y /api/... (resto de los recursos).
    # NOTA: Render free tier no permite tráfico de red privada entrante a servicios free,
    # por eso apuntamos a la URL pública HTTPS del backend en lugar del hostname interno.
    location /auth/ {
        proxy_pass https://tacs-backend-25gc.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass https://tacs-backend-25gc.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}