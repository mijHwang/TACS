###############################################################################
# Configuración de Nginx para el deploy con HTTPS (Let's Encrypt).
#
# NO se usa en local: se monta sobre /etc/nginx/conf.d/default.conf únicamente
# a través de docker-compose.prod.yml en la EC2. El nginx.conf base (HTTP, sin
# TLS) sigue siendo el que se usa para `docker compose up` en desarrollo.
###############################################################################

# ─── HTTP (80) ───────────────────────────────────────────────────────────────
# Sólo sirve el challenge de ACME (renovación del certificado) y redirige todo
# el resto del tráfico a HTTPS.
server {
    listen 80;
    server_name tacs-g3-figuritas.duckdns.org;

    # Validación de Let's Encrypt (webroot compartido con el contenedor certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cualquier otra cosa → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (443) ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name tacs-g3-figuritas.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tacs-g3-figuritas.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tacs-g3-figuritas.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback: cualquier ruta que no sea un archivo estático vuelve a index.html
    # Esto es CRÍTICO para React Router con history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso al backend. Se preserva el path completo (proxy_pass sin barra final)
    # porque el backend expone /auth/... (login/register) y /api/... (resto de los recursos).
    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS (443) — Origen detrás de Cloudflare (tacs-g3-figuritas.dev) ────────
# Cloudflare termina el TLS público con su Universal SSL y reconecta a este origen
# por HTTPS (modo Full strict) validando este Cloudflare Origin Certificate.
# nginx selecciona este bloque por SNI (Host = tacs-g3-figuritas.dev). El bloque
# del DuckDNS sigue siendo el default para acceso directo a la IP.
server {
    listen 443 ssl;
    server_name tacs-g3-figuritas.dev *.tacs-g3-figuritas.dev;

    ssl_certificate     /etc/nginx/cloudflare/origin.pem;
    ssl_certificate_key /etc/nginx/cloudflare/origin.key;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Restaurar la IP real del visitante (si no, el backend ve la IP de Cloudflare).
    # Rangos oficiales de Cloudflare: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
