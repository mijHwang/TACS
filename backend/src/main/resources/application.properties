spring.application.name=tp

# --- JWT ---
# Secreto de firma. En prod/docker se exige via env JWT_SECRET (ver application-docker.properties).
# El valor por defecto de abajo es SOLO para desarrollo/tests locales: NO es un secreto real,
# no se usa en la nube y puede vivir en el repo sin riesgo. HS256 requiere >= 32 caracteres.
jwt.secret=${JWT_SECRET:dev-only-secret-not-for-prod-change-me-1234567890}
# Vigencia del token en milisegundos (default 24 h).
jwt.expiration-ms=86400000