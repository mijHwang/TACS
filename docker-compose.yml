services:
  # ─────────────────────────────────────────────
  # MONGO — base de datos (local, persistente por volumen)
  # ─────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: tacs-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - tacs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # BACKEND — Spring Boot corriendo en JVM
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tacs-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Por defecto usa el Mongo del container; si se setea SPRING_MONGODB_URI (p. ej. Atlas) se respeta.
      - SPRING_MONGODB_URI=${SPRING_MONGODB_URI:-mongodb://mongo:27017/tacs}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tacs-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # FRONTEND — React (Vite build) servido por Nginx
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tacs-frontend
    ports:
      - "80:80"
    networks:
      - tacs-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # TELEGRAM BOT — cliente REST del backend (grammY)
  # ─────────────────────────────────────────────
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: tacs-telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_URL=http://backend:8080
    networks:
      - tacs-net
    restart: unless-stopped
    depends_on:
      - backend

# Red interna bridge: los contenedores se comunican por nombre de servicio
networks:
  tacs-net:
    driver: bridge

# Volumen nombrado: los datos de Mongo sobreviven a `docker compose down`
volumes:
  mongo-data:
